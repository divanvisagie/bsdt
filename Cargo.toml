[package]
name = "bsdt"
version = "0.2.1"
edition = "2024"
license = "BSD-3-Clause"
homepage = "https://bsdt.divanv.com"
repository = "https://github.com/divanvisagie/bsdt"
readme = "README.md"
description = "Repeatable FreeBSD development VMs from a TOML file, booted with QEMU from the official images"
keywords = ["freebsd", "qemu", "vm", "bsd", "development"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/examples", "/docs", "/templates", "/scripts", "/TESTING.md"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }
libc = "0.2.190"
liblzma = "0.4.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.7"

[profile.release]
opt-level = 3

# Hashing and decompressing a ~700 MB image is painfully slow unoptimized.
[profile.dev.package.liblzma-sys]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
